<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>VEX Pocket</title>
<style>
:root{
  color-scheme:dark;
  --app-h:100dvh;
  --bg:#0b0d10;
  --panel:#11151a;
  --panel2:#171c22;
  --line:#242b33;
  --text:#e8edf2;
  --muted:#7f8b98;
  --accent:#79b8ff;
  --keyword:#c792ea;
  --type:#82aaff;
  --fn:#ffd166;
  --string:#c3e88d;
  --number:#f78c6c;
  --comment:#63707d;
  --attr:#82d9ff;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif
}
button{font:inherit;color:inherit}
.app{
  height:var(--app-h);
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  background:var(--bg);
  padding-top:env(safe-area-inset-top)
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;border-bottom:1px solid var(--line);
  background:rgba(11,13,16,.96);backdrop-filter:blur(14px)
}
.brand{display:flex;align-items:center;gap:9px}
.logo{
  width:29px;height:29px;border-radius:8px;
  background:linear-gradient(145deg,#79b8ff,#9b7cff);
  color:#08101a;display:grid;place-items:center;font-weight:800
}
.title{font-size:15px;font-weight:700}
.subtitle{font-size:11px;color:var(--muted);margin-top:1px}
.actions{display:flex;gap:7px}
.icon-btn{
  border:1px solid var(--line);background:var(--panel2);
  border-radius:9px;height:36px;padding:0 10px
}

/* Editor */
.editor-shell{
  min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);
  overflow:hidden;background:var(--bg)
}
.gutter{
  min-width:42px;padding:10px 8px 30px 0;
  text-align:right;background:#0d1014;border-right:1px solid var(--line);
  color:#596675;font:14px/1.58 "SFMono-Regular",Menlo,monospace;
  overflow:hidden;user-select:none
}
.editor-stack{
  position:relative;min-width:0;min-height:0;overflow:hidden
}
.highlight,.editor{
  position:absolute;inset:0;margin:0;
  padding:10px 12px 30px;
  overflow:auto;white-space:pre-wrap;overflow-wrap:break-word;
  tab-size:4;
  font:16px/1.58 "SFMono-Regular",Menlo,Consolas,monospace;
}
.highlight{
  pointer-events:none;color:var(--text);background:transparent;
  scrollbar-width:none
}
.highlight::-webkit-scrollbar{display:none}
.editor{
  resize:none;border:0;outline:0;background:transparent;
  color:transparent;
  caret-color:var(--accent);
  -webkit-text-fill-color:transparent;
  spellcheck:false;
}
.editor::selection{background:rgba(121,184,255,.25)}
.editor:focus{outline:none}

/* Syntax */
.tok-keyword{color:var(--keyword)}
.tok-type{color:var(--type)}
.tok-fn{color:var(--fn);font-weight:650}
.tok-string{color:var(--string)}
.tok-number{color:var(--number)}
.tok-comment{color:var(--comment);font-style:italic}
.tok-attr{color:var(--attr)}
.tok-preproc{color:#f07178}

/* Completion */
.completion{
  display:none;
  border-top:1px solid var(--line);
  background:#0f141a;
  padding:5px 7px
}
.completion.show{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.comp-btn{
  min-width:0;border:1px solid #33404c;background:#19212a;
  border-radius:8px;padding:6px 8px;text-align:left;
  font:12px/1.25 "SFMono-Regular",Menlo,monospace
}
.comp-btn strong{
  display:block;color:var(--fn);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.comp-btn span{
  display:block;color:var(--muted);font-size:10px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

/* Info */
.info{
  border-top:1px solid var(--line);background:var(--panel);
  padding:8px 12px;max-height:116px;overflow:auto
}
.info-title{font:700 13px "SFMono-Regular",Menlo,monospace;color:var(--fn)}
.info-signature{font:12px/1.35 "SFMono-Regular",Menlo,monospace;color:#c8d4df;margin-top:3px}
.info-desc{font-size:11px;line-height:1.4;color:var(--muted);margin-top:3px}

/* Toolbar */
.bottom{
  border-top:1px solid var(--line);background:#0d1014;
  padding-bottom:env(safe-area-inset-bottom)
}
.keys{
  display:grid;grid-template-columns:1.15fr repeat(4,1fr) repeat(4,1fr);
  gap:5px;padding:6px 7px
}
.key{
  min-width:0;height:36px;border:1px solid #303842;
  background:#1a2027;border-radius:8px;
  font:700 14px "SFMono-Regular",Menlo,monospace;
  padding:0 3px
}
.key.tab{color:var(--accent)}
.key.nav{font-size:18px}

@media (orientation:landscape) and (max-height:520px){
  header{padding:5px 8px}
  .logo{width:25px;height:25px}
  .title{font-size:13px}
  .subtitle{display:none}
  .icon-btn{height:29px;font-size:12px}
  .info{display:none}
  .highlight,.editor{font-size:14px;padding-top:6px;padding-bottom:12px}
  .gutter{font-size:13px;padding-top:6px;padding-bottom:12px}
  .keys{padding:4px 5px;gap:4px}
  .key{height:30px;font-size:12px}
  .key.nav{font-size:16px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">
      <div class="logo">V</div>
      <div>
        <div class="title">VEX Pocket</div>
        <div class="subtitle">scratch.vex · v0.6 · no dependencies</div>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="sampleBtn">예제</button>
      <button class="icon-btn" id="clearBtn">새로</button>
    </div>
  </header>

  <div class="editor-shell">
    <div class="gutter" id="gutter">1</div>
    <div class="editor-stack">
      <pre class="highlight" id="highlight"></pre>
      <textarea class="editor" id="editor" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    </div>
  </div>

  <div class="completion" id="completion"></div>

  <section class="info">
    <div class="info-title" id="infoTitle">VEX Pocket v0.6</div>
    <div class="info-signature" id="infoSignature">순수 HTML/CSS/JS 에디터</div>
    <div class="info-desc" id="infoDesc">VEX 함수는 노란색, attribute는 파란색으로 표시합니다.</div>
  </section>

  <div class="bottom">
    <nav class="keys">
      <button class="key tab" data-action="tab">⇥ Tab</button>
      <button class="key nav" data-action="left">←</button>
      <button class="key nav" data-action="up">↑</button>
      <button class="key nav" data-action="down">↓</button>
      <button class="key nav" data-action="right">→</button>
      <button class="key" data-insert="{}" data-cursor="-1">{ }</button>
      <button class="key" data-insert="[]" data-cursor="-1">[ ]</button>
      <button class="key" data-insert="()" data-cursor="-1">( )</button>
      <button class="key" data-insert=";">;</button>
    </nav>
  </div>
</div>

<script>
const STORAGE_KEY="vex-pocket-code-v06";
const editor=document.getElementById("editor");
const highlight=document.getElementById("highlight");
const gutter=document.getElementById("gutter");
const completion=document.getElementById("completion");
const app=document.getElementById("app");

const infoTitle=document.getElementById("infoTitle");
const infoSignature=document.getElementById("infoSignature");
const infoDesc=document.getElementById("infoDesc");

const VEX_FUNCTIONS={
  point:["point(int geo, string attrib, int ptnum)","Point attribute 값을 읽습니다."],
  pointattrib:["pointattrib(int geo, string attrib, int ptnum, int &success)","Point attribute와 success를 읽습니다."],
  setpointattrib:['setpointattrib(int geo, string name, int ptnum, value, string mode="set")',"Point attribute를 수정합니다."],
  nearpoint:["nearpoint(int geo, vector pos [, float maxdist])","가장 가까운 point를 찾습니다."],
  nearpoints:["nearpoints(int geo, vector pos, float maxdist [, int maxpts])","주변 point들을 거리순으로 찾습니다."],
  pcfind:["pcfind(int geo, string Pchannel, vector P, float radius, int maxpoints)","반경 안의 point를 찾습니다."],
  prim:["prim(int geo, string attrib, int primnum)","Primitive attribute를 읽습니다."],
  primattrib:["primattrib(int geo, string attrib, int primnum, int &success)","Primitive attribute와 success를 읽습니다."],
  detail:["detail(int geo, string attrib [, int ignored])","Detail attribute를 읽습니다."],
  vertex:["vertex(int geo, string attrib, int vertexnum)","Vertex attribute를 읽습니다."],
  normalize:["normalize(vector v)","벡터 길이를 1로 만듭니다."],
  length:["length(vector v)","벡터 길이를 반환합니다."],
  distance:["distance(vector a, vector b)","두 위치 사이 거리를 반환합니다."],
  dot:["dot(vector a, vector b)","Dot product를 반환합니다."],
  cross:["cross(vector a, vector b)","Cross product를 반환합니다."],
  fit:["fit(float v,float omin,float omax,float nmin,float nmax)","값을 다른 범위로 remap합니다."],
  fit01:["fit01(float v,float nmin,float nmax)","0-1 값을 다른 범위로 remap합니다."],
  lerp:["lerp(a,b,bias)","두 값을 보간합니다."],
  clamp:["clamp(v,min,max)","값을 범위 안으로 제한합니다."],
  min:["min(a,b)","최솟값을 반환합니다."],
  max:["max(a,b)","최댓값을 반환합니다."],
  abs:["abs(x)","절댓값을 반환합니다."],
  rand:["rand(seed)","의사 난수를 반환합니다."],
  noise:["noise(pos)","Noise 값을 반환합니다."],
  snoise:["snoise(pos)","Signed noise 값을 반환합니다."],
  chf:['chf(string name)',"Float parameter를 읽습니다."],
  chi:['chi(string name)',"Integer parameter를 읽습니다."],
  chv:['chv(string name)',"Vector parameter를 읽습니다."],
  chs:['chs(string name)',"String parameter를 읽습니다."],
  chramp:['chramp(string name,float pos)',"Ramp parameter를 샘플링합니다."],
  addpoint:["addpoint(int geo, vector pos)","Point를 추가합니다."],
  removepoint:["removepoint(int geo,int ptnum)","Point를 제거합니다."],
  addprim:["addprim(int geo,string type,...)","Primitive를 추가합니다."],
  removeprim:["removeprim(int geo,int primnum,int andpoints)","Primitive를 제거합니다."],
  len:["len(array_or_string)","배열/문자열 길이를 반환합니다."],
  append:["append(array,value)","배열 뒤에 값을 추가합니다."],
  push:["push(array,value)","배열 뒤에 값을 추가합니다."],
  pop:["pop(array)","배열 마지막 값을 제거/반환합니다."],
  sort:["sort(array)","배열을 정렬합니다."],
  reverse:["reverse(array)","배열 순서를 뒤집습니다."],
  getbbox_center:["getbbox_center(int geo)","Bounding box 중심을 반환합니다."]
};

const TYPES=new Set([
  "void","int","float","vector","vector2","vector4","matrix","matrix2","matrix3",
  "string","dict","struct"
]);

const KEYWORDS=new Set([
  "if","else","for","foreach","while","do","switch","case","default",
  "break","continue","return","function","export","const"
]);

function escapeHTML(s){
  return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function highlightCode(code){
  let out="";
  let i=0;

  while(i<code.length){
    const c=code[i];
    const n=code[i+1];

    // line comment
    if(c==="/" && n==="/"){
      let j=i+2;
      while(j<code.length && code[j]!="\n")j++;
      out+='<span class="tok-comment">'+escapeHTML(code.slice(i,j))+'</span>';
      i=j;continue;
    }

    // block comment
    if(c==="/" && n==="*"){
      let j=i+2;
      while(j<code.length-1 && !(code[j]==="*" && code[j+1]==="/"))j++;
      j=Math.min(code.length,j+2);
      out+='<span class="tok-comment">'+escapeHTML(code.slice(i,j))+'</span>';
      i=j;continue;
    }

    // string
    if(c==='"'){
      let j=i+1,esc=false;
      while(j<code.length){
        const ch=code[j];
        if(esc){esc=false;j++;continue}
        if(ch==="\\"){esc=true;j++;continue}
        if(ch==='"'){j++;break}
        j++;
      }
      out+='<span class="tok-string">'+escapeHTML(code.slice(i,j))+'</span>';
      i=j;continue;
    }

    // attribute
    const attrMatch=code.slice(i).match(/^(?:[fvisp]|u)?@[A-Za-z_]\w*/);
    if(attrMatch){
      out+='<span class="tok-attr">'+escapeHTML(attrMatch[0])+'</span>';
      i+=attrMatch[0].length;continue;
    }

    // number
    const numMatch=code.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);
    if(numMatch){
      out+='<span class="tok-number">'+numMatch[0]+'</span>';
      i+=numMatch[0].length;continue;
    }

    // identifier
    const idMatch=code.slice(i).match(/^[A-Za-z_]\w*/);
    if(idMatch){
      const w=idMatch[0];
      let cls="";
      if(KEYWORDS.has(w))cls="tok-keyword";
      else if(TYPES.has(w))cls="tok-type";
      else{
        let j=i+w.length;
        while(j<code.length && /\s/.test(code[j]))j++;
        if(code[j]==="(" && VEX_FUNCTIONS[w])cls="tok-fn";
      }
      out+=cls?'<span class="'+cls+'">'+w+'</span>':w;
      i+=w.length;continue;
    }

    if(c==="#" && (i===0 || code[i-1]==="\n")){
      let j=i;
      while(j<code.length && code[j]!="\n")j++;
      out+='<span class="tok-preproc">'+escapeHTML(code.slice(i,j))+'</span>';
      i=j;continue;
    }

    out+=escapeHTML(c);
    i++;
  }

  return out+"\n";
}

function updateHighlight(){
  highlight.innerHTML=highlightCode(editor.value);
  gutter.textContent=Array.from({length:editor.value.split("\n").length},(_,i)=>i+1).join("\n");
  syncScroll();
}

function syncScroll(){
  highlight.scrollTop=editor.scrollTop;
  highlight.scrollLeft=editor.scrollLeft;
  gutter.scrollTop=editor.scrollTop;
}

function currentPrefix(){
  const pos=editor.selectionStart;
  const before=editor.value.slice(0,pos);
  const m=before.match(/([A-Za-z_][A-Za-z0-9_]*)$/);
  if(!m)return null;
  return {text:m[1],from:pos-m[1].length,to:pos};
}

function updateCompletion(){
  const hit=currentPrefix();
  completion.innerHTML="";
  completion.classList.remove("show");
  if(!hit || hit.text.length<2)return;

  const q=hit.text.toLowerCase();
  const matches=Object.keys(VEX_FUNCTIONS)
    .filter(name=>name.toLowerCase().startsWith(q) && name.toLowerCase()!==q)
    .slice(0,4);

  if(!matches.length)return;

  for(const name of matches){
    const b=document.createElement("button");
    b.className="comp-btn";
    b.type="button";
    b.innerHTML="<strong>"+name+"()</strong><span>"+VEX_FUNCTIONS[name][0]+"</span>";

    b.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
    b.addEventListener("mousedown",e=>e.preventDefault());

    b.addEventListener("click",()=>{
      const now=currentPrefix();
      if(!now)return;
      editor.setRangeText(name+"(",now.from,now.to,"end");
      updateAll();
      showInfo(name);
      editor.focus();
    });

    completion.appendChild(b);
  }

  completion.classList.add("show");
}

function showInfo(name){
  if(!VEX_FUNCTIONS[name])return;
  infoTitle.textContent=name+"()";
  infoSignature.textContent=VEX_FUNCTIONS[name][0];
  infoDesc.textContent=VEX_FUNCTIONS[name][1];
}

function inspectCaret(){
  const pos=editor.selectionStart;
  const text=editor.value;
  let s=pos,e=pos;
  while(s>0 && /[A-Za-z0-9_]/.test(text[s-1]))s--;
  while(e<text.length && /[A-Za-z0-9_]/.test(text[e]))e++;
  const word=text.slice(s,e);
  if(VEX_FUNCTIONS[word])showInfo(word);
}

let saveTimer;
function updateAll(){
  updateHighlight();
  updateCompletion();
  inspectCaret();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>localStorage.setItem(STORAGE_KEY,editor.value),120);
}

editor.addEventListener("input",updateAll);
editor.addEventListener("keyup",()=>{updateCompletion();inspectCaret()});
editor.addEventListener("click",()=>{updateCompletion();inspectCaret()});
editor.addEventListener("scroll",syncScroll);

function insertText(text,cursorShift=0){
  const start=editor.selectionStart;
  const end=editor.selectionEnd;
  editor.setRangeText(text,start,end,"end");
  const pos=start+text.length+cursorShift;
  editor.setSelectionRange(pos,pos);
  updateAll();
  editor.focus();
}

function moveHorizontal(delta){
  const p=Math.max(0,Math.min(editor.value.length,editor.selectionStart+delta));
  editor.setSelectionRange(p,p);
  editor.focus();
}

function moveVertical(delta){
  const p=editor.selectionStart;
  const before=editor.value.slice(0,p);
  const lineStart=before.lastIndexOf("\n")+1;
  const col=p-lineStart;

  if(delta<0){
    if(lineStart===0)return;
    const prevEnd=lineStart-1;
    const prevStart=editor.value.lastIndexOf("\n",prevEnd-1)+1;
    const next=prevStart+Math.min(col,prevEnd-prevStart);
    editor.setSelectionRange(next,next);
  }else{
    const lineEnd=editor.value.indexOf("\n",p);
    if(lineEnd<0)return;
    const nextStart=lineEnd+1;
    let nextEnd=editor.value.indexOf("\n",nextStart);
    if(nextEnd<0)nextEnd=editor.value.length;
    const next=nextStart+Math.min(col,nextEnd-nextStart);
    editor.setSelectionRange(next,next);
  }
  editor.focus();
}

document.querySelectorAll(".key").forEach(btn=>{
  btn.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
  btn.addEventListener("mousedown",e=>e.preventDefault());

  btn.addEventListener("click",()=>{
    const action=btn.dataset.action;
    if(action==="tab"){insertText("    ");return}
    if(action==="left"){moveHorizontal(-1);return}
    if(action==="right"){moveHorizontal(1);return}
    if(action==="up"){moveVertical(-1);return}
    if(action==="down"){moveVertical(1);return}

    if(btn.dataset.insert!==undefined){
      insertText(btn.dataset.insert,Number(btn.dataset.cursor||0));
    }
  });
});

document.getElementById("sampleBtn").onclick=()=>{
  editor.value=`int pts[] = nearpoints(0, @P, chf("radius"));

foreach (int pt; pts)
{
    vector p = point(0, "P", pt);
    @Cd += p;
}
`;
  editor.setSelectionRange(0,0);
  updateAll();
  editor.focus();
};

document.getElementById("clearBtn").onclick=()=>{
  editor.value="// New VEX\n\n";
  editor.setSelectionRange(editor.value.length,editor.value.length);
  updateAll();
  editor.focus();
};

function syncViewport(){
  const vv=window.visualViewport;
  const h=vv?vv.height:window.innerHeight;
  document.documentElement.style.setProperty("--app-h",Math.round(h)+"px");
}
window.addEventListener("resize",syncViewport);
if(window.visualViewport){
  visualViewport.addEventListener("resize",syncViewport);
  visualViewport.addEventListener("scroll",syncViewport);
}
syncViewport();

editor.value=
  localStorage.getItem(STORAGE_KEY) ??
  localStorage.getItem("vex-pocket-code-v05") ??
`// VEX Pocket v0.6
// near 를 입력해 자동완성을 확인하세요.

vector center = getbbox_center(0);
vector dir = normalize(@P - center);

float amount = chf("amount");
@P += dir * amount;
`;

updateAll();
</script>
</body>
</html>
