<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>VEX Pocket</title>
<style>
:root{
  color-scheme:dark;
  --app-h:100dvh;
  --bg:#0b0d10;--panel:#11151a;--panel2:#171c22;--line:#242b33;
  --text:#e8edf2;--muted:#8e9aa7;--accent:#79b8ff;--fn:#ffd166;
  --ok:#58d68d;--warn:#f5b642;--danger:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button{font:inherit;color:inherit}
.app{height:var(--app-h);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;background:var(--bg);padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(11,13,16,.96);backdrop-filter:blur(16px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#79b8ff,#9b7cff);display:grid;place-items:center;font-weight:800;color:#08101a;flex:0 0 auto}
.title{font-size:16px;font-weight:700}
.subtitle{font-size:11px;color:var(--muted);margin-top:1px}
.actions{display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-width:38px;height:38px;padding:0 10px}
#editor{min-height:0;overflow:hidden}
.cm-editor{height:100%;background:var(--bg);font-size:16px}
.cm-scroller{font-family:"SFMono-Regular",Menlo,Consolas,monospace;line-height:1.58;overscroll-behavior:contain}
.cm-content{padding:10px 0 30px;caret-color:var(--accent)!important}
.cm-line{padding:0 10px}
.cm-gutters{background:#0d1014!important;border-right:1px solid var(--line)!important;color:#596675!important}
.cm-activeLine,.cm-activeLineGutter{background:rgba(121,184,255,.055)!important}
.cm-cursor,.cm-dropCursor{border-left:2px solid var(--accent)!important;margin-left:-1px!important;visibility:visible!important}
.cm-vex-function{color:var(--fn)!important;font-weight:650}
.cm-vex-attribute{color:#82d9ff!important}
.info{border-top:1px solid var(--line);background:var(--panel);max-height:124px;overflow:auto;padding:9px 14px}
.app.keyboard .info{display:none}
.info-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.fn-name{font-family:"SFMono-Regular",Menlo,monospace;font-size:13px;font-weight:700;color:var(--fn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);white-space:nowrap}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--danger)}
.signature{font-family:"SFMono-Regular",Menlo,monospace;font-size:12px;color:#c8d4df;white-space:pre-wrap;overflow-wrap:anywhere}
.desc{font-size:12px;color:var(--muted);line-height:1.42;margin-top:4px}
.bottom{background:#0d1014;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.keys{display:grid;grid-template-columns:1.15fr repeat(4,1fr) repeat(4,1fr);gap:5px;padding:6px 7px}
.key{min-width:0;border:1px solid #303842;background:#1a2027;border-radius:8px;height:36px;padding:0 4px;font-family:"SFMono-Regular",Menlo,monospace;font-size:14px;font-weight:700;touch-action:manipulation}
.key.nav{font-size:18px}.key.tab{color:var(--accent)}
.keyboard-tools{display:none;align-items:center;justify-content:space-between;padding:0 9px 7px;color:var(--muted);font-size:11px}
.app.keyboard .keyboard-tools{display:flex}
.done{border:1px solid #34404c;background:#1b232c;border-radius:8px;height:31px;padding:0 12px;color:var(--accent);font-weight:700}
@media (orientation:landscape) and (max-height:520px){
  header{padding:5px 10px}.logo{width:26px;height:26px}.title{font-size:14px}.subtitle{display:none}
  .icon-btn{height:30px;min-width:34px;padding:0 8px;font-size:12px}.info{display:none!important}
  .cm-editor{font-size:14px}.keys{padding:4px 6px;gap:4px}.key{height:31px;font-size:12px}.key.nav{font-size:16px}
}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="brand">
    <div class="logo">V</div>
    <div><div class="title">VEX Pocket</div><div class="subtitle">scratch.vex · v0.5 · C++ parser</div></div>
  </div>
  <div class="actions">
    <button class="icon-btn" id="sampleBtn">예제</button>
    <button class="icon-btn" id="clearBtn">새로</button>
  </div>
</header>

<main id="editor"></main>

<section class="info">
  <div class="info-top">
    <div class="fn-name" id="fnName">VEX Pocket v0.5</div>
    <div class="status ok" id="status">✓ editor ready</div>
  </div>
  <div class="signature" id="signature">C++ parser + VEX completion</div>
  <div class="desc" id="description">VEX 함수는 노란색, attribute는 파란색으로 표시합니다.</div>
</section>

<div class="bottom">
  <nav class="keys">
    <button class="key tab" data-action="tab">⇥ Tab</button>
    <button class="key nav" data-action="left">←</button>
    <button class="key nav" data-action="up">↑</button>
    <button class="key nav" data-action="down">↓</button>
    <button class="key nav" data-action="right">→</button>
    <button class="key" data-insert="{}" data-cursor="-1">{ }</button>
    <button class="key" data-insert="[]" data-cursor="-1">[ ]</button>
    <button class="key" data-insert="()" data-cursor="-1">( )</button>
    <button class="key" data-insert=";">;</button>
  </nav>
  <div class="keyboard-tools">
    <span>VEX Quick Keys</span>
    <button class="done" id="doneBtn">완료</button>
  </div>
</div>
</div>

<script type="module">
import {basicSetup} from "https://esm.sh/codemirror@6.0.1";
import {EditorState, StateField} from "https://esm.sh/@codemirror/state@6.5.2";
import {EditorView, Decoration} from "https://esm.sh/@codemirror/view@6.39.15";
import {cpp} from "https://esm.sh/@codemirror/lang-cpp@6.0.3";
import {autocompletion} from "https://esm.sh/@codemirror/autocomplete@6.20.1";

const STORAGE_KEY="vex-pocket-code-v05";
const app=document.getElementById("app");

const vexFunctions={
 point:["point(int geo, string attrib, int ptnum)","Point attribute 값을 읽습니다."],
 pointattrib:["pointattrib(int geo, string attrib, int ptnum, int &success)","Point attribute를 읽고 success도 반환합니다."],
 setpointattrib:['setpointattrib(int geo, string name, int ptnum, value, string mode="set")',"Point attribute를 수정합니다."],
 nearpoint:["nearpoint(int geo, vector pos [, float maxdist])","가장 가까운 point를 찾습니다."],
 nearpoints:["nearpoints(int geo, vector pos, float maxdist [, int maxpts])","주변 point들을 거리순으로 찾습니다."],
 pcfind:["pcfind(int geo, string Pchannel, vector P, float radius, int maxpoints)","반경 내 point들을 찾습니다."],
 prim:["prim(int geo, string attrib, int primnum)","Primitive attribute 값을 읽습니다."],
 detail:["detail(int geo, string attrib [, int ignored])","Detail attribute 값을 읽습니다."],
 normalize:["normalize(vector v)","벡터를 정규화합니다."],
 length:["length(vector v)","벡터 길이를 반환합니다."],
 distance:["distance(vector a, vector b)","두 위치 사이 거리를 반환합니다."],
 dot:["dot(vector a, vector b)","Dot product를 반환합니다."],
 cross:["cross(vector a, vector b)","Cross product를 반환합니다."],
 fit:["fit(float v,float omin,float omax,float nmin,float nmax)","값을 다른 범위로 remap합니다."],
 lerp:["lerp(a,b,bias)","두 값 사이를 보간합니다."],
 clamp:["clamp(v,min,max)","값을 범위 안으로 제한합니다."],
 rand:["rand(seed)","의사 난수를 반환합니다."],
 noise:["noise(pos)","Noise 값을 반환합니다."],
 chf:['chf(string name)',"Float parameter를 읽습니다."],
 chi:['chi(string name)',"Integer parameter를 읽습니다."],
 chv:['chv(string name)',"Vector parameter를 읽습니다."],
 chramp:['chramp(string name,float pos)',"Ramp 값을 샘플링합니다."],
 addpoint:["addpoint(int geo, vector pos)","Point를 추가합니다."],
 removepoint:["removepoint(int geo,int ptnum)","Point를 제거합니다."],
 addprim:["addprim(int geo,string type,...)","Primitive를 추가합니다."],
 len:["len(array_or_string)","배열/문자열 길이를 반환합니다."]
};

const attributes={
 "@P":"vector @P","@Cd":"vector @Cd","@N":"vector @N","@ptnum":"int @ptnum",
 "@primnum":"int @primnum","@numpt":"int @numpt","@numprim":"int @numprim",
 "@Time":"float @Time","@Frame":"float @Frame"
};

function vexCompletion(context){
  const word=context.matchBefore(/(?:[A-Za-z_]\w*|@[A-Za-z_]\w*)/);
  if(!word)return null;
  if(word.from===word.to && !context.explicit)return null;

  const options=[
    ...Object.entries(vexFunctions).map(([label,v])=>({
      label,type:"function",detail:v[0],info:v[1],
      apply(view,completion,from,to){
        view.dispatch({
          changes:{from,to,insert:label+"("},
          selection:{anchor:from+label.length+1}
        });
      }
    })),
    ...Object.entries(attributes).map(([label,detail])=>({label,type:"variable",detail}))
  ];

  return {from:word.from,options,validFor:/(?:[A-Za-z_]\w*|@[A-Za-z_]\w*)/};
}

function buildDecorations(state){
  const decos=[];
  const text=state.doc.toString();

  const fnRe=/\b([A-Za-z_]\w*)\s*(?=\()/g;
  let m;
  while((m=fnRe.exec(text))){
    if(vexFunctions[m[1]]){
      decos.push(Decoration.mark({class:"cm-vex-function"}).range(m.index,m.index+m[1].length));
    }
  }

  const attrRe=/(?:[fvisp]|u)?@[A-Za-z_]\w*/g;
  while((m=attrRe.exec(text))){
    decos.push(Decoration.mark({class:"cm-vex-attribute"}).range(m.index,m.index+m[0].length));
  }

  return Decoration.set(decos,true);
}

const vexDecorations=StateField.define({
  create:buildDecorations,
  update(value,tr){
    if(tr.docChanged)return buildDecorations(tr.state);
    return value;
  },
  provide:f=>EditorView.decorations.from(f)
});

const defaultCode=`// VEX Pocket v0.5
// C++ syntax parser + VEX function completion

vector center = getbbox_center(0);
vector dir = normalize(@P - center);

float amount = chf("amount");
@P += dir * amount;
`;

const initial=
  localStorage.getItem(STORAGE_KEY) ??
  localStorage.getItem("vex-pocket-code-v04") ??
  localStorage.getItem("vex-pocket-code-v03") ??
  defaultCode;

let saveTimer;

const view=new EditorView({
  state:EditorState.create({
    doc:initial,
    extensions:[
      basicSetup,
      cpp(),
      vexDecorations,
      autocompletion({
        override:[vexCompletion],
        activateOnTyping:true,
        maxRenderedOptions:8
      }),
      EditorView.lineWrapping,
      EditorView.updateListener.of(update=>{
        if(update.docChanged){
          clearTimeout(saveTimer);
          saveTimer=setTimeout(()=>localStorage.setItem(STORAGE_KEY,update.state.doc.toString()),150);
        }
      }),
      EditorView.theme({
        "&":{backgroundColor:"#0b0d10",color:"#e8edf2"},
        ".cm-content":{caretColor:"#79b8ff"},
        ".cm-cursor":{borderLeftColor:"#79b8ff",borderLeftWidth:"2px"},
        ".cm-tooltip":{backgroundColor:"#171c22",border:"1px solid #303842"},
        ".cm-tooltip-autocomplete > ul > li[aria-selected]":{backgroundColor:"#253140",color:"#fff"}
      },{dark:true})
    ]
  }),
  parent:document.getElementById("editor")
});

function syncViewport(){
  const vv=window.visualViewport;
  const h=vv?vv.height:window.innerHeight;
  document.documentElement.style.setProperty("--app-h",Math.round(h)+"px");
  const keyboardOpen=vv?(window.innerHeight-vv.height>140):false;
  app.classList.toggle("keyboard",keyboardOpen);
}
syncViewport();
window.addEventListener("resize",syncViewport);
if(window.visualViewport){
  visualViewport.addEventListener("resize",syncViewport);
  visualViewport.addEventListener("scroll",syncViewport);
}

function moveVertical(dir){
  const pos=view.state.selection.main.head;
  const line=view.state.doc.lineAt(pos);
  const col=pos-line.from;
  const targetNo=Math.max(1,Math.min(view.state.doc.lines,line.number+dir));
  const target=view.state.doc.line(targetNo);
  const next=target.from+Math.min(col,target.length);
  view.dispatch({selection:{anchor:next},scrollIntoView:true});
  view.focus();
}

document.querySelectorAll(".key").forEach(btn=>{
  btn.addEventListener("pointerdown",e=>e.preventDefault());
  btn.addEventListener("click",()=>{
    const action=btn.dataset.action;
    const sel=view.state.selection.main;
    if(action==="tab"){
      view.dispatch({changes:{from:sel.from,to:sel.to,insert:"    "},selection:{anchor:sel.from+4},scrollIntoView:true});
      view.focus();return;
    }
    if(action==="left"||action==="right"){
      const next=Math.max(0,Math.min(view.state.doc.length,sel.head+(action==="left"?-1:1)));
      view.dispatch({selection:{anchor:next},scrollIntoView:true});view.focus();return;
    }
    if(action==="up"){moveVertical(-1);return}
    if(action==="down"){moveVertical(1);return}
    const insert=btn.dataset.insert;
    if(insert!==undefined){
      const shift=Number(btn.dataset.cursor||0);
      const next=sel.from+insert.length+shift;
      view.dispatch({changes:{from:sel.from,to:sel.to,insert},selection:{anchor:next},scrollIntoView:true});
      view.focus();
    }
  });
});

document.getElementById("doneBtn").onclick=()=>view.contentDOM.blur();

document.getElementById("sampleBtn").onclick=()=>{
  const code=`int pts[] = nearpoints(0, @P, chf("radius"));

foreach (int pt; pts)
{
    vector p = point(0, "P", pt);
    @Cd += p;
}
`;
  view.dispatch({changes:{from:0,to:view.state.doc.length,insert:code},selection:{anchor:0}});
  view.focus();
};

document.getElementById("clearBtn").onclick=()=>{
  const code="// New VEX\n\n";
  view.dispatch({changes:{from:0,to:view.state.doc.length,insert:code},selection:{anchor:code.length}});
  view.focus();
};
</script>
</body>
</html>
